<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Encuesta de 7 preguntas, sin nombre ni correo, sobre cómo los estudiantes buscan y citan información en sus trabajos.">
<meta name="color-scheme" content="light">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='29' fill='none' stroke='%231550C8' stroke-width='5'/%3E%3Cpath d='M19 33 L28 42 L45 23' stroke='%231550C8' stroke-width='6' stroke-linecap='round' stroke-linejoin='round' fill='none'/%3E%3C/svg%3E">
<title>Encuesta de VeriTech</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..900&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Paleta clara FIJA: nada de prefers-color-scheme. El teléfono de quien
   responde suele estar en modo oscuro y eso apagaba la encuesta entera. */
:root{
  color-scheme:light;
  --bg:#EDF2FB; --bg2:#DDE8FA; --card:#FFFFFF;
  --ink:#0B1726; --muted:#57687C;
  --brand:#1550C8; --brand-soft:#E4EDFF; --brand-line:#B9D0FF;
  --energy:#FF6B35; --energy-fuerte:#B23C0B; --energy-soft:#FFE8DE;
  --ok:#0E8A5F; --ok-soft:#DFF5EC;
  --line:#DCE4EF;
  --sombra:0 1px 2px rgba(11,23,38,.04), 0 10px 30px -12px rgba(21,80,200,.22);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--bg)}
body{
  margin:0; min-height:100dvh; color:var(--ink); background:var(--bg);
  background-image:radial-gradient(90rem 40rem at 50% -12rem, var(--bg2) 0%, var(--bg) 62%);
  font-family:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:16px; line-height:1.5;
  display:flex; flex-direction:column; align-items:center;
  padding-block:18px 24px; padding-left:16px; padding-right:16px; gap:16px;
}
h1,h2{font-family:Archivo,"Helvetica Neue",sans-serif; margin:0; letter-spacing:-.025em; text-wrap:balance}
p{margin:0}

/* ---------- cabecera ---------- */
.top{width:100%; max-width:540px; display:flex; align-items:center; gap:11px}
.rose{width:30px; height:30px; color:var(--brand); flex:none}
.marca{font-family:Archivo,sans-serif; font-variation-settings:"wdth" 116,"wght" 800; font-size:1.2rem; line-height:1}
.sub{font-size:.76rem; color:var(--muted); line-height:1.25}

/* ---------- barra de avance ---------- */
.avance{width:100%; max-width:540px; display:flex; flex-direction:column; gap:7px}
.riel{height:6px; background:#fff; border:1px solid var(--line); border-radius:99px; overflow:hidden}
.riel i{display:block; height:100%; width:0; border-radius:99px;
  background:linear-gradient(90deg,var(--brand),var(--energy)); transition:width .35s cubic-bezier(.4,0,.2,1)}
.paso{display:flex; justify-content:space-between; font-size:.72rem; color:var(--muted); font-weight:500}
.paso b{color:var(--brand); font-weight:600}

/* ---------- tarjeta ---------- */
.carta{
  width:100%; max-width:540px; background:var(--card); border:1px solid var(--line);
  border-radius:16px; box-shadow:var(--sombra); padding:26px 22px;
  display:flex; flex-direction:column; gap:18px;
}
.entra{animation:entrar .32s cubic-bezier(.22,1,.36,1) both}
@keyframes entrar{from{opacity:0; transform:translateY(14px)}to{opacity:1; transform:none}}

.preg{font-family:Archivo,sans-serif; font-variation-settings:"wdth" 104,"wght" 700;
  font-size:1.34rem; line-height:1.22}
.pista{font-size:.85rem; color:var(--muted); margin-top:-8px}

.ops{display:flex; flex-direction:column; gap:10px}
.op{
  position:relative; display:flex; align-items:center; gap:13px; cursor:pointer;
  border:2px solid var(--line); border-radius:12px; padding:15px 16px;
  background:#fff; font-size:1rem; line-height:1.3; font-weight:500;
  transition:border-color .14s, background .14s, transform .08s;
}
.op:active{transform:scale(.985)}
@media (hover:hover){.op:hover{border-color:var(--brand-line); background:var(--brand-soft)}}
.op input{position:absolute; opacity:0; width:0; height:0}
.bolita{width:22px; height:22px; border-radius:50%; border:2px solid #C6D2E2; flex:none;
  display:grid; place-items:center; transition:border-color .14s}
.bolita::after{content:""; width:11px; height:11px; border-radius:50%; background:var(--brand);
  transform:scale(0); transition:transform .16s cubic-bezier(.34,1.56,.64,1)}
/* .sel lo pone el JS: no dependemos de :has(), que falla en móviles viejos */
.op.sel{border-color:var(--brand); background:var(--brand-soft)}
.op.sel .bolita{border-color:var(--brand)}
.op.sel .bolita::after{transform:scale(1)}
.op.foco{outline:3px solid var(--brand-line); outline-offset:2px}

/* ---------- botones ---------- */
.btn{
  font-family:Archivo,sans-serif; font-variation-settings:"wdth" 108,"wght" 700;
  font-size:1rem; letter-spacing:.01em; border-radius:12px; padding:16px;
  cursor:pointer; width:100%; border:2px solid var(--brand);
  background:var(--brand); color:#fff; transition:filter .14s, transform .08s;
}
.btn:active{transform:scale(.99)}
.btn:hover{filter:brightness(1.08)}
.btn.fantasma{background:#fff; color:var(--brand)}
.btn:focus-visible{outline:3px solid var(--energy); outline-offset:2px}
.atras{
  align-self:flex-start; background:none; border:0; color:var(--muted); cursor:pointer;
  font-family:inherit; font-size:.82rem; padding:.4em 0; text-decoration:underline;
}
.atras:hover{color:var(--ink)}

/* ---------- intro ---------- */
.intro h1{font-variation-settings:"wdth" 112,"wght" 800; font-size:1.75rem; line-height:1.1}
.chips{display:flex; flex-wrap:wrap; gap:8px}
.chip{background:var(--brand-soft); color:var(--brand); border-radius:99px;
  padding:.4em .85em; font-size:.8rem; font-weight:600}
.chip.naranja{background:var(--energy-soft); color:#C2410C}

/* ---------- final ---------- */
.tick{width:54px; height:54px; border-radius:50%; background:var(--ok-soft); color:var(--ok);
  display:grid; place-items:center; font-size:1.7rem; font-weight:700}
.final h2{font-variation-settings:"wdth" 112,"wght" 800; font-size:1.6rem; color:var(--ok)}
.eco{display:flex; flex-direction:column; gap:9px}
.fila{
  display:grid; grid-template-columns:auto 1fr; gap:11px; align-items:start;
  background:#F7FAFF; border:1px solid var(--line); border-radius:11px; padding:12px 13px;
}
.fila .p{font-size:.74rem; color:var(--muted); line-height:1.35}
.fila .r{font-size:.92rem; font-weight:600; line-height:1.3; margin-top:.15em}
.fila .eco-txt{font-size:.8rem; color:var(--brand); line-height:1.4; margin-top:.3em}
.fila .n{width:26px; height:26px; border-radius:8px; background:var(--brand-soft); color:var(--brand);
  display:grid; place-items:center; font-size:.76rem; font-weight:700; flex:none}
.cta{
  display:block; text-align:center; text-decoration:none; background:var(--energy-fuerte); color:#fff;
  border:2px solid var(--energy-fuerte); border-radius:12px; padding:16px;
  font-family:Archivo,sans-serif; font-variation-settings:"wdth" 108,"wght" 700; font-size:1rem;
}
.cta:hover{filter:brightness(1.07)}
.otra{background:none; border:0; color:var(--muted); font-family:inherit; font-size:.78rem;
  text-decoration:underline; cursor:pointer; padding:.4em}
.otra:hover{color:var(--ink)}
.err{font-size:.86rem; color:#B3261E; text-align:center}
.consent{display:flex; gap:10px; align-items:flex-start; font-size:.84rem; line-height:1.45; color:var(--ink);
  background:var(--brand-soft); border:1px solid var(--brand-line); border-radius:11px; padding:12px 13px; cursor:pointer}
.consent input{width:20px; height:20px; flex:none; margin:1px 0 0; accent-color:var(--brand); cursor:pointer}
.consent a{color:var(--brand)}
.btn[disabled]{opacity:.45; cursor:not-allowed; filter:none}
.pie{font-size:.72rem; color:var(--muted); text-align:center; max-width:540px}
.pie a{color:var(--muted)}
.pie a:hover{color:var(--brand)}
@media (prefers-reduced-motion:reduce){*{animation:none!important; transition:none!important}}
@media (max-width:380px){.carta{padding:20px 16px} .preg{font-size:1.2rem}}
</style>
</head>
<body>

<div class="top">
  <svg class="rose" viewBox="0 0 64 64" fill="none" aria-hidden="true">
    <circle cx="32" cy="32" r="28" stroke="currentColor" stroke-width="4"/>
    <path d="M19 33 L28 42 L45 23" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </svg>
  <div>
    <div class="marca">VeriTech</div>
    <p class="sub">Encuesta para nuestro proyecto de colegio</p>
  </div>
</div>

<div class="avance" id="avance" hidden>
  <div class="riel"><i id="relleno"></i></div>
  <div class="paso"><span id="paso"></span><span id="queda"></span></div>
</div>

<form id="f" name="encuesta-veritech" method="POST" data-netlify="true" netlify-honeypot="trampa" style="width:100%;max-width:540px">
  <input type="hidden" name="form-name" value="encuesta-veritech">
  <!-- Marca el origen: las pruebas se envian con otro valor y la pagina de
       resultados las descarta, para que nunca contaminen los datos reales. -->
  <input type="hidden" name="origen" value="web">
  <input type="hidden" name="consentimiento">
  <input type="hidden" name="q1"><input type="hidden" name="q2"><input type="hidden" name="q3">
  <input type="hidden" name="q4"><input type="hidden" name="q5"><input type="hidden" name="q6">
  <input type="hidden" name="q7">
  <p hidden><label>No llenar <input name="trampa"></label></p>
  <div id="zona"></div>
  <noscript>
    <div class="carta">
      <p class="preg">Necesitas activar JavaScript</p>
      <p style="color:var(--muted)">Esta encuesta no puede funcionar sin él. Activa JavaScript en tu navegador y recarga la página.</p>
    </div>
  </noscript>
</form>

<p class="pie" id="pie">No pedimos tu nombre ni tu correo</p>
<p class="pie"><a href="/privacidad.html">Privacidad</a> · <a href="/terminos.html">Términos</a> · <a href="/cookies.html">Cookies y almacenamiento</a> · <a href="/">Volver a la herramienta</a></p>

<script src="/js/encuesta.js"></script>
</body>
</html>
